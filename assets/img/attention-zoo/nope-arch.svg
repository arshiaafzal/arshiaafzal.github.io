<svg viewBox="0 0 280 460" xmlns="http://www.w3.org/2000/svg" font-family="'Inter',system-ui,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#6b7280"/>
  </marker>
  <marker id="darr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8"/>
  </marker>
</defs>

<!-- cx=140 -->

<text x="140" y="18" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Output</text>
<line x1="140" y1="24" x2="140" y2="38" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- W_O output projection (trapezoid, wider at bottom) -->
<polygon points="98,38 182,38 194,66 86,66" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="140" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">W_O (Linear)</text>

<line x1="140" y1="66" x2="140" y2="80" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ⊕ residual -->
<circle cx="140" cy="90" r="11" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="94.5" text-anchor="middle" font-size="13" fill="#374151">⊕</text>

<line x1="140" y1="101" x2="140" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- FFN rect -->
<rect x="80" y="115" width="120" height="28" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
<text x="140" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">FFN / MLP</text>

<line x1="140" y1="143" x2="140" y2="157" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- LayerNorm rect -->
<rect x="80" y="157" width="120" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">LayerNorm</text>

<line x1="140" y1="185" x2="140" y2="199" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ⊕ residual -->
<circle cx="140" cy="209" r="11" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="213.5" text-anchor="middle" font-size="13" fill="#374151">⊕</text>

<line x1="140" y1="220" x2="140" y2="234" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Causal Softmax Attention — wide rect with NoPE badge -->
<rect x="50" y="234" width="180" height="38" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="140" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Causal Softmax Attn</text>
<!-- NoPE badge -->
<rect x="100" y="258" width="80" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
<text x="140" y="270" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">∅ No Pos. Encoding</text>

<!-- 3 branches: W_Q=100, W_K=140, W_V=180 -->
<line x1="100" y1="272" x2="100" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="140" y1="272" x2="140" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="180" y1="272" x2="180" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- W_Q trap -->
<polygon points="74,288 126,288 130,314 70,314" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="100" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">W_Q</text>
<!-- W_K trap -->
<polygon points="114,288 166,288 170,314 110,314" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="140" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">W_K</text>
<!-- W_V trap -->
<polygon points="154,288 206,288 210,314 150,314" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="180" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">W_V</text>

<text x="100" y="331" text-anchor="middle" font-size="9.5" fill="#6b7280" font-weight="700">Q</text>
<text x="140" y="331" text-anchor="middle" font-size="9.5" fill="#6b7280" font-weight="700">K</text>
<text x="180" y="331" text-anchor="middle" font-size="9.5" fill="#6b7280" font-weight="700">V</text>

<line x1="140" y1="157" x2="140" y2="171" stroke="#6b7280" stroke-width="1.5"/>

<!-- LayerNorm (bottom) rect -->
<rect x="80" y="337" width="120" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">LayerNorm</text>

<!-- merge Q K V back to LayerNorm input -->
<line x1="100" y1="337" x2="100" y2="353" stroke="#6b7280" stroke-width="1.5"/>
<line x1="140" y1="337" x2="140" y2="353" stroke="#6b7280" stroke-width="1.5"/>
<line x1="180" y1="337" x2="180" y2="353" stroke="#6b7280" stroke-width="1.5"/>

<!-- Actually connect branches converge to input -->
<line x1="100" y1="338" x2="100" y2="382" stroke="#6b7280" stroke-width="1.5"/>
<line x1="140" y1="338" x2="140" y2="382" stroke="#6b7280" stroke-width="1.5"/>
<line x1="180" y1="338" x2="180" y2="382" stroke="#6b7280" stroke-width="1.5"/>
<line x1="100" y1="382" x2="180" y2="382" stroke="#6b7280" stroke-width="1.5"/>
<line x1="140" y1="382" x2="140" y2="402" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="80" y="337" width="120" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">LayerNorm</text>

<text x="140" y="420" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Input (no PE)</text>

<!-- residual skips -->
<path d="M78,400 Q62,400 62,209" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="3,2"/>
<line x1="62" y1="209" x2="128" y2="209" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#darr)"/>
<path d="M78,402 Q44,402 44,90" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="3,2"/>
<line x1="44" y1="90" x2="128" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#darr)"/>

</svg>
