<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg" font-family="'Inter',system-ui,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#6b7280"/>
  </marker>
  <marker id="darr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8"/>
  </marker>
</defs>

<!-- cx=110 for main column, cx=220 for gate branch -->

<text x="110" y="18" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Output</text>
<line x1="110" y1="24" x2="110" y2="38" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Linear output trap (wider at bottom) -->
<polygon points="66,38 154,38 166,66 54,66" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="110" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Linear</text>

<line x1="110" y1="66" x2="110" y2="80" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- N groupnorm circle -->
<circle cx="110" cy="90" r="11" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="110" y="94.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="600">N</text>

<line x1="110" y1="101" x2="110" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ⊗ multiply (SSM output × gate) -->
<circle cx="110" cy="125" r="11" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="110" y="129.5" text-anchor="middle" font-size="13" fill="#374151">⊗</text>

<!-- Y label beside ⊗ -->
<text x="130" y="129" font-size="10" fill="#dc2626" font-style="italic" font-weight="600">Y</text>

<line x1="110" y1="136" x2="110" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- SSM rect (cyan) — with parameter labels -->
<rect x="40" y="150" width="140" height="40" rx="5" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<text x="110" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">SSM</text>
<!-- A X B C labels in red italic -->
<text x="55"  y="184" font-size="9" fill="#dc2626" font-style="italic" font-weight="600">A</text>
<text x="88"  y="184" font-size="9" fill="#dc2626" font-style="italic" font-weight="600">X</text>
<text x="115" y="184" font-size="9" fill="#dc2626" font-style="italic" font-weight="600">B</text>
<text x="140" y="184" font-size="9" fill="#dc2626" font-style="italic" font-weight="600">C</text>

<!-- scalar a_t badge -->
<rect x="168" y="155" width="72" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="204" y="168" text-anchor="middle" font-size="8.5" fill="#dc2626" font-weight="600">scalar a_t ∈(0,1)</text>

<line x1="110" y1="190" x2="110" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- σ (sigmoid before SSM) -->
<circle cx="110" cy="214" r="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="110" y="218" text-anchor="middle" font-size="10.5" fill="#374151">σ</text>

<line x1="110" y1="224" x2="110" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Conv1d rect -->
<rect x="60" y="238" width="100" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="110" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Conv1d</text>

<line x1="110" y1="266" x2="110" y2="282" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Linear input projection trap (wider at bottom = input) -->
<polygon points="14,282 206,282 218,342 2,342" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="110" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Linear Projection</text>

<line x1="110" y1="342" x2="110" y2="368" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<text x="110" y="388" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Input x</text>

<!-- RIGHT gate branch: from input → σ → into ⊗ -->
<path d="M186,372 Q220,372 220,125" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
<!-- σ on gate branch at y≈260 -->
<circle cx="220" cy="260" r="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="264" text-anchor="middle" font-size="10.5" fill="#94a3b8">σ</text>
<!-- arrow from gate branch to ⊗ -->
<line x1="220" y1="125" x2="122" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#darr)"/>
<text x="240" y="200" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic" transform="rotate(90,240,200)">gate branch</text>

</svg>
