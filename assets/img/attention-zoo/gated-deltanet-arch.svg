<svg viewBox="0 0 300 560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter',system-ui,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#6b7280"/>
  </marker>
  <marker id="darr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8"/>
  </marker>
</defs>

<!-- cx=150 for main column -->

<text x="150" y="18" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Output</text>
<line x1="150" y1="24" x2="150" y2="38" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Linear output trap (wider at bottom) -->
<polygon points="108,38 192,38 204,66 96,66" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="150" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Linear</text>

<line x1="150" y1="66" x2="150" y2="80" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ⊗ gate multiply -->
<circle cx="150" cy="90" r="11" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="150" y="94.5" text-anchor="middle" font-size="13" fill="#374151">⊗</text>

<line x1="150" y1="101" x2="150" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Norm rect -->
<rect x="100" y="115" width="100" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Norm</text>

<line x1="150" y1="143" x2="150" y2="157" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Gated Delta Rule — wide rect -->
<rect x="60" y="157" width="180" height="32" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="150" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">Gated Delta Rule</text>

<!-- 4 branches: q/k=78, v=118, α=168, β=218 -->
<!-- q/k branch x=78 -->
<line x1="78" y1="189" x2="78" y2="203" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="54" y="203" width="48" height="24" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="78" y="219" text-anchor="middle" font-size="9.5" font-weight="600" fill="#14532d">L2 Norm</text>
<line x1="78" y1="227" x2="78" y2="241" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="78" cy="252" r="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="78" y="256" text-anchor="middle" font-size="10" fill="#374151">σ</text>
<line x1="78" y1="262" x2="78" y2="276" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="54" y="276" width="48" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="78" y="292" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991b1b">Conv1d</text>
<line x1="78" y1="300" x2="78" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="54,316 102,316 106,342 50,342" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="78" y="333" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">Linear</text>
<text x="78" y="358" text-anchor="middle" font-size="9" fill="#6b7280" font-weight="700">q, k</text>

<!-- v branch x=128 -->
<line x1="128" y1="189" x2="128" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="128" cy="239" r="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="128" y="243" text-anchor="middle" font-size="10" fill="#374151">σ</text>
<line x1="128" y1="249" x2="128" y2="263" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="104" y="263" width="48" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="128" y="279" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991b1b">Conv1d</text>
<line x1="128" y1="287" x2="128" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="104,316 152,316 156,342 100,342" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="128" y="333" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">Linear</text>
<text x="128" y="358" text-anchor="middle" font-size="9" fill="#6b7280" font-weight="700">v</text>

<!-- α branch x=183 (scalar gate — triangle symbol) -->
<line x1="183" y1="189" x2="183" y2="248" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="183" cy="259" r="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="183" y="263" text-anchor="middle" font-size="10" fill="#374151">σ</text>
<line x1="183" y1="269" x2="183" y2="283" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- Triangle shape for α (scalar lower-tri / forget gate) -->
<polygon points="163,283 203,283 183,305" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<line x1="183" y1="305" x2="183" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="159,316 207,316 211,342 155,342" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="183" y="333" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">Linear</text>
<text x="183" y="358" text-anchor="middle" font-size="8.5" fill="#d97706" font-weight="700">α (scalar)</text>

<!-- β branch x=232 -->
<line x1="232" y1="189" x2="232" y2="258" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="232" cy="269" r="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="232" y="273" text-anchor="middle" font-size="10" fill="#374151">σ</text>
<line x1="232" y1="279" x2="232" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="208,316 256,316 260,342 204,342" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="232" y="333" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">Linear</text>
<text x="232" y="358" text-anchor="middle" font-size="9" fill="#6b7280" font-weight="700">β</text>

<!-- merge all 4 branches -->
<line x1="78"  y1="365" x2="78"  y2="381" stroke="#6b7280" stroke-width="1.5"/>
<line x1="128" y1="365" x2="128" y2="381" stroke="#6b7280" stroke-width="1.5"/>
<line x1="183" y1="365" x2="183" y2="381" stroke="#6b7280" stroke-width="1.5"/>
<line x1="232" y1="365" x2="232" y2="381" stroke="#6b7280" stroke-width="1.5"/>
<line x1="78" y1="381" x2="232" y2="381" stroke="#6b7280" stroke-width="1.5"/>
<line x1="155" y1="381" x2="155" y2="401" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

<text x="150" y="420" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">Input</text>

<!-- gate bypass: side path from input to ⊗ -->
<path d="M255,410 Q270,410 270,90" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="3,2"/>
<line x1="270" y1="90" x2="162" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#darr)"/>
<text x="278" y="260" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic" transform="rotate(90,278,260)">g (gate)</text>

</svg>
